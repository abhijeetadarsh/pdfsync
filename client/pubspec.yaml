name: pdfsync
description: Cross-platform PDF reader that syncs PDFs and annotations through a central server.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^2.6.0              # PDFium-based viewer: Android, iOS, macOS, Windows, Linux, Web
  sembast: ^3.8.0            # local NoSQL DB (pure Dart) with live queries
  sembast_web: ^2.4.0        # IndexedDB backend for web
  path_provider: ^2.1.4
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  crypto: ^3.0.5
  file_picker: ">=8.1.0 <11.0.0"
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
