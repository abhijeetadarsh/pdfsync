one\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M20 12H5M11 6l-6 6 6 6\"><\/path><\/svg><\/button>\n    <div style=\"width:220px;min-width:0;padding:0 8px\">\n      <div style=\"font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Generative AI System Design\u2026<\/div>\n      <div style=\"margin-top:2px;font-size:11px;color:#a6adc8;display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;background:#a6e3a1;display:inline-block\"><\/span>synced<\/div>\n    <\/div>\n    <span style=\"flex:1\"><\/span>\n\n    <!-- tools -->\n    <div style=\"display:flex;align-items:center;gap:2px\">\n      <button aria-label=\"Browse\" style=\"width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#a6adc8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M5 3l14 8-6 2-2 6z\"><\/path><\/svg><\/button>\n      <button aria-label=\"Highlight\" style=\"position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#cba6f7;background:#1e1e2e\"><span style=\"position:absolute;left:0;right:0;top:0;height:2px;background:#cba6f7\"><\/span><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M14 4l6 6-9 9H5v-6zM4 22h16\"><\/path><\/svg><\/button>\n      <button aria-label=\"Ink\" style=\"width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#a6adc8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M4 20l1-4L16 5l3 3L8 19z\"><\/path><\/svg><\/button>\n      <button aria-label=\"Note\" style=\"width:48px;height:48px;display:f ems:center;justify-content:center;color:#a6adc8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3\"><\/path><\/svg><\/button>\n    <button aria-label=\"Redo\" style=\"width:44px;height:48px;display:flex;align-items:center;justify-content:center;color:#a6adc8\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3\"><\/path><\/svg><\/button>\n    <button aria-label=\"Page theme\" style=\"width:44px;height:48px;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\/circle><path d=\"M12 4a8 8 0 010 16z\" fill=\"currentColor\"><\/path><\/svg><\/button>\n    <button aria-label=\"Hide annotations panel\" style=\"width:44px;height:48px;display:flex;align-items:center;justify-content:center;color:#cba6f7\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M3 4h18v16H3zM15 4v16\"><\/path><\/svg><\/button>\n  <\/div>\n\n  <div style=\"flex:1;min-height:0;display:flex\">\n    <!-- page area -->\n    <div style=\"position:relative;flex:1;min-width:0;overflow:hidden;display:flex;justify-content:center;padding-top:24px\">\n      <div style=\"position:relative;width:560px;height:900px;flex:none;background:#fff;font-family:Inter,Arial,sans-serif;color:#2b2b2b;padding:36px 48px\">\n        <div style=\"text-align:right;font-size:10px;color:#777;height:14px\">1. Introduction and Overview<\/div>\n        <div style=\"margin-top:36px;font-size:14px;font-weight:700;color:#111;height:20px\">Self-attention<\/div>\n        <p style=\"margin:14px 0 0 0;font-size:12.5px;line-height:21px\">Transformers process a whole sequence in parallel. Instead of reading tokens one at a time, each token looks at every other token and decides how much of it to take in.<\/p>\n        <p style=\"margin:14px 0 0 0;font-size:12.5px;line-height:21px\">To do this, every token embedding is projected into three vectors: a query, a key and a value. Comparing a query with all keys gives a score for each position; <span style=\"background:rgba(203,166,247,0.5)\">a softmax turns the scores into weights that sum to one.<\/span><\/p>\n        <div style=\"margin-top:30px;text-align:center;font-family:'Times New Roman',serif;font-style:italic;font-size:17px;color:#111;height:32px\">Attention(Q, K, V) = softmax( QK\u1d40 / \u221ad\u2096 ) V<\/div>\n        <p style=\"margin:24px 0 0 0;font-size:12.5px;line-height:21px\">Dividing by \u221ad\u2096 keeps the dot products from growing too large, which would push the softmax into regions with <span style=\"background:rgba(249,226,175,0.85)\">vanishing gradients<\/span> during backpropagation.<\/p>\n        <div style=\"position:absolute;right:48px;bottom:28px;font-size:10px;color:#777\">19<\/div>\n        <svg style=\"position:absolute;left:0;top:0\" width=\"560\" height=\"900\" viewBox=\"0 0 560 900\" fill=\"none\" aria-hidden=\"true\"><path d=\"M44 300 C 150 284, 400 284, 512 304 C 530 336, 450 358, 280 352 C 130 348, 36 342, 34 318 C 34 308, 40 302, 52 298\" stroke=\"#e64553\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\/path><\/svg>\n      <\/div>\n      <div style=\"position:absolute;left:50%;transform:translateX(-50%);bottom:20px;background:#313244;color:#cdd6f4;font-size:12px;padding:8px 14px;display:flex;gap:10px\"><span>23 / 306<\/span><span style=\"color:#a6adc8\">8%<\/span><\/div>\n    <\/div>\n\n    <!-- panel -->\n    <aside style=\"width:296px;flex:none;background:#181825;border-left:1px solid #313244;display:flex;flex-direction:column\">\n      <div style=\"display:flex;border-bottom:1px solid #313244;padding:0 8px\">\n        <button style=\"position:relative;height:44px;padding:0 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#cba6f7\"><span style=\"position:absolute;left:0;right:0;top:0;height:2px;background:#cba6f7\"><\/span>Annotations 5<\/button>\n        <button style=\"height:44px;padding:0 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#a6adc8\">Contents<\/button>\n      <\/div>\n      <div style=\"flex:1;overflow:hidden\">\n        <div style=\"padding:14px 16px;border-bottom:1px solid #313244\">\n          <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#a6adc8\"><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;background:#f9e2af;display:inline-block\"><\/span>Highlight<\/span><span>p.19<\/span><\/div>\n          <div style=\"margin-top:6px;font-size:12px;line-height:1.5\">vanishing gradients during backpropagation<\/div>\n        <\/div>\n        <div style=\"position:relative;padding:14px 16px;border-bottom:1px solid #313244;background:#1e1e2e\">\n          <span style=\"position:absolute;left:0;right:0;top:0;height:2px;background:#cba6f7\"><\/span>\n          <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#a6adc8\"><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;background:#cba6f7;display:inline-block\"><\/span>Highlight + note<\/span><span>p.19<\/span><\/div>\n          <div style=\"margin-top:6px;font-size:12px;line-height:1.5\">a softmax turns the scores into weights that sum to one<\/div>\n          <div style=\"margin-top:8px;padding:8px 10px;background:#313244;font-size:12px;line-height:1.5\">Why softmax over rows, not columns?<\/div>\n        <\/div>\n        <div style=\"padding:14px 16px;border-bottom:1px solid #313244\">\n          <div style=\"display:flex;justify-cont \n          \n          <div style=\"width:84px;height:112px;background:#fff;padding:10px 8px;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"height:2px;background:#bbb;width:50%\"><\/div><div style=\"height:2px;background:#ccc\"><\/div><div style=\"height:2px;background:#ccc\"><\/div><div style=\"height:2px;background:#ccc;width:80%\"><\/div><div style=\"height:12px\"><\/div><div style=\"height:2px;background:#ccc\"><\/div><div style=\"height:2px;background:#ccc;width:70%\"><\/div>\n          <\/div>\n          <span style=\"font-size:11px;color:#a6adc8\">25<\/span>\n        <\/div>\n      \n    <\/aside>\n\n    <!-- page area -->\n    <div style=\"position:relative;flex:1;min-width:0;overflow:hidden;display:flex;justify-content:center;padding-top:28px\">\n      <div style=\"position:relative;width:660px;height:1000px;flex:none;background:#fff;font-family:Inter,Arial,sans-serif;color:#2b2b2b;padding:44px 56px\">\n        <div style=\"text-align:right;font-size:11px;color:#777;height:14px\">1. Introduction and Overview<\/div>\n        <div style=\"margin-top:40px;font-size:16px;font-weight:700;color:#111;height:22px\">Self-attention<\/div>\n        <p style=\"margin:16px 0 0 0;font-size:14px;line-height:24px\">Transformers process a whole sequence in parallel. Instead of reading tokens one at a time, each token looks at every other token and decides how much of it to take in.<\/p>\n        <p style=\"margin:16px 0 0 0;font-size:14px;line-height:24px\">To do this, every token embedding is projected into three vectors: a query, a key and a value. Comparing a query with all keys gives a score for each position; <span style=\"background:rgba(203,166,247,0.5)\">a softmax turns the scores into weights that sum to one.<\/span><\/p>\n        <div style=\"margin-top:34px;text-align:center;font-family:'Times New Roman',serif;font-style:italic;font-size:19px;color:#111;height:34px\">Attention(Q, K, V) = softmax( QK\u1d40 / \u221ad\u2096 ) V<\/div>\n        <p style=\"margin:28px 0 0 0;font-size:14px;line-height:24px\">Dividing by \u221ad\u2096 keeps the dot products from growing too large, which would push the softmax into regions with <span style=\"background:rgba(249,226,175,0.85)\">vanishing gradients<\/span> during backpropagation.<\/p>\n        <div style=\"position:absolute;right:56px;bottom:30px;font-size:11px;color:#777\">19<\/div>\n        <svg style=\"position:absolute;left:0;top:0\" width=\"660\" height=\"1000\" viewBox=\"0 0 660 1000\" fill=\"none\" aria-hidden=\"true\"><path d=\"M52 346 C 170 328, 470 328, 604 350 C 626 388, 530 412, 330 406 C 150 402, 40 396, 38 368 C 38 356, 46 348, 60 344\" stroke=\"#e64553\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\/path><\/svg>\n      <\/div>\n    <\/div>\n\n    <!-- annotations panel -->\n    <aside style=\"width:320px;flex:none;background:#181825;border-left:1px solid #313244;display:flex;flex-direction:column\">\n      <div style=\"display:flex;border-bottom:1px solid #313244;padding:0 8px\">\n        <button style=\"position:relative;height:40px;padding:0 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#cba6f7\"><span style=\"position:absolute;left:0;right:0;top:0;height:2px;background:#cba6f7\"><\/span>Annotations 5<\/button>\n        <button style=\"height:40px;padding:0 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#a6adc8\">Search<\/button>\n        <button style=\"height:40px;padding:0 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#a6adc8\">Contents<\/button>\n      <\/div>\n      <div style=\"display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid #313244;font-size:11px\">\n        <button style=\"height:26px;padding:0 10px;background:#313244;color:#cdd6f4\">All<\/button>\n        <button style=\"height:26px;padding:0 10px;color:#a6adc8\">Highlights<\/button>\n        <button style=\"height:26px;padding:0 10px;color:#a6adc8\">Notes<\/button>\n        <button style=\"heig     <span>Page 23 / 306<\/span>\n    <span>8% read<\/span>\n    <span style=\"flex:1\"><\/span>\n    <span>Ctrl F find<\/span>\n    <span>Ctrl G go to page<\/span>\n    <span>F11 focus mode<\/span>\n  <\/div>\n<\/div>\n\n\n\n\n<script>\nconst screenIndex=7;\nfunction go(i){parent.postMessage({pdfScreen:i},'*')}\nfunction feedback(s){let e=document.getElementById('feedback');if(!e){e=document.createElement('div');e.id='feedback';e.role='status';document.body.append(e)}e.textContent=s;clearTimeout(window.messageTimer);window.messageTimer=setTimeout(()=>e.remove(),3500)}\ndocument.querySelectorAll('button').forEach((b,i)=>{let name=b.getAttribute('aria-label')||b.textContent.trim()||b.title||['Select','Highlight','Pen','Note','Eraser','Color'][i%6];if(!b.textContent.trim()&&!b.getAttribute('aria-label')) b.setAttribute('aria-label',name);b.title=name;b.onclick=()=>{if(/Sign in/.test(name)){const inputs=[...document.querySelectorAll('input')];if(inputs.some(x=>!x.value.trim())){feedback('Enter your email and password to continue.');return}go(1)}else if(/Resume|Continue/.test(name))go(screenIndex===6?7:screenIndex===4?5:2);else if(/Back|Library/.test(name))go(screenIndex>5?6:screenIndex>3?4:1);else if(/Close/.test(name))go(2);else if(/Annotations/.test(name)&&screenIndex<4)go(3);else if(/Add PDF/.test(name)){const f=document.createElement('input');f.type='file';f.accept='application/pdf';f.onchange=()=>feedback(f.files[0]?f.files[0].name+' selected \u2014 preview only.':'No PDF selected.');f.click()}else if(/All|Reading|Finished|Highlights|Notes|Ink|Contents/.test(name)){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));feedback(name+' selected \u00b7 illustrative preview')}else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');feedback(name+' \u00b7 design preview')}}});\nconst search=document.querySelector('input[aria-label=\"Search documents\"]');if(search){const rows=[...document.querySelectorAll('div')].filter(e=>/border-top:1px solid/.test(e.getAttribute('style')||'')&&/pages|Uploading/.test(e.textContent));search.addEventListener('input',()=>{const q=search.value.toLowerCase();rows.forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));if(q&&rows.every(r=>r.hidden))feedback('No documents match \u201c'+search.value+'\u201d.')});rows.forEach(r=>{r.tabIndex=0;r.role='button';r.setAttribute('aria-label','Open '+r.textContent.trim());r.style.cursor='pointer';r.onclick=()=>go(screenIndex===6?7:screenIndex===4?5:2);r.onkeydown=e=>{if(e.key==='Enter')r.click()}})}\n<\/script><\/body><\/html>"];const names=["Sign in", "Library", "Reader", "Annotations", "Library", "Reader", "Library", "Reader"];
const groups={phone:[0,1,2,3],tablet:[4,5],desktop:[6,7]},dimensions={phone:[390,844],tablet:[1024,768],desktop:[1440,900]};let device='phone',current=1;const select=document.getElementById('screen'),frame=document.getElementById('preview'),stage=document.getElementById('stage');function resize(){let [w,h]=dimensions[device],scale=1;stage.style.maxWidth=w+'px';scale=Math.min(1,stage.getBoundingClientRect().width/w);stage.style.height=h*scale+'px';frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')'}function render(){select.innerHTML=groups[device].map(i=>'<option value="'+i+'">'+names[i]+'</option>').join('');select.value=current;frame.srcdoc=screens[current];document.getElementById('label').textContent=device[0].toUpperCase()+device.slice(1)+' / '+names[current];document.getElementById('size').textContent=dimensions[device].join(' × ');document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device)));resize()}select.onchange=()=>{current=+select.value;render()};document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{let reader=[2,3,5,7].includes(current);device=b.dataset.device;current=groups[device][reader?(device==='phone'?2:1):(device==='phone'?1:0)];render()});window.addEventListener('resize',resize);window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!Number.isInteger(e.data?.pdfScreen)||!screens[e.data.pdfScreen])return;current=e.data.pdfScreen;device=current<4?'phone':current<6?'tablet':'desktop';render()});render();
