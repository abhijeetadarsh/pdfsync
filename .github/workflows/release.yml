# Release pipeline – runs only for pushes to main. See docs/ci-cd.md.
#
#  checks ──┬─ server   → Docker image ghcr.io/<owner>/pdfsync-server (:latest, :<version>, :sha-…)
#           ├─ android  → signed release APK
#           ├─ linux    → x64 bundle (.tar.gz)
#           └─ windows  → x64 bundle (.zip)
#                          └─ release → GitHub Release v<pubspec version>-build.<run number> with all three
name: Release

on:
  push:
    branches: [main]

# One release at a time; a newer push waits instead of cancelling a release
# that is half published.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  checks:
    name: Tests and analysis
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from pubspec
        id: version
        run: |
          v=$(grep -E '^version:' client/pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Server tests
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          # The client's sync integration test talks to a real server.
          go build -o "$RUNNER_TEMP/pdfsync-server" .

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Client analysis and tests
        working-directory: client
        env:
          PDFSYNC_SERVER_BIN: ${{ runner.temp }}/pdfsync-server
        run: |
          flutter pub get
          flutter analyze
          flutter test

  server:
    name: Server image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # build-push-action otherwise uploads a "*.dockerbuild" build record as
      # a workflow artifact, which download-artifact can't extract.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pdfsync-server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.checks.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see docs/ci-cd.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > client/android/key.properties

      - name: Build
        working-directory: client
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/pdfsync-${{ needs.checks.outputs.tag }}-android.apk"

      - name: Remove signing files
        if: always()
        run: rm -f client/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux bundle
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: client
        run: |
          flutter build linux --release --build-number=${{ github.run_number }}
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf "../dist/pdfsync-${{ needs.checks.outputs.tag }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows bundle
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: client
        shell: pwsh
        run: |
          flutter build windows --release --build-number=${{ github.run_number }}
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../dist/pdfsync-${{ needs.checks.outputs.tag }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [checks, server, android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the app bundles: other jobs' artifacts (e.g. Docker build records)
      # are not release files, and the first release failed extracting one.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{android,linux,windows}"
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/pdfsync-server
        run: |
          ls -l dist
          notes="Built from ${GITHUB_SHA::7} on main.

          - Android: signed release APK
          - Linux x64: extract and run \`./pdfsync\`
          - Windows x64: extract and run \`pdfsync.exe\`
          - Server: \`docker pull $IMAGE:${{ needs.checks.outputs.version }}\` (also \`:latest\`)"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "pdfsync $TAG" \
            --notes "$notes"
